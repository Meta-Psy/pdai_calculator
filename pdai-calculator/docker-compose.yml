services:
  app:
    image: pdai-app:${IMAGE_TAG:?set IMAGE_TAG to the image SHA (CI sets it; never a floating latest)}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      
    volumes:
      - ./nginx/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../certbot/conf:/etc/letsencrypt:ro
      - ../../certbot/www:/var/www/certbot:ro
    # nginx reads certs only at start/reload; certbot (separate container)
    # renews them on disk. Reload every 6h so a renewed cert is picked up.
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ../../certbot/conf:/etc/letsencrypt
      - ../../certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
