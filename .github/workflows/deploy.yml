name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdai-calculator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pdai-calculator/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  build-image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pdai-app:${{ github.sha }} pdai-calculator
      - name: Save image as gzipped tar
        run: docker save pdai-app:${{ github.sha }} | gzip > /tmp/pdai-app.tar.gz
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdai-image
          path: /tmp/pdai-app.tar.gz
          retention-days: 1

  deploy:
    needs: build-image
    # Re-enabled for push-deploy in a later step after the first controlled
    # workflow_dispatch run verifies /home/calc/app serves correctly.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: pdai-image
          path: /tmp
      - name: Copy image tar to the box
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: /tmp/pdai-app.tar.gz
          target: /tmp
      - name: Load image and bring up the stack
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            docker load -i /tmp/pdai-app.tar.gz
            cd ~/app
            git fetch origin main
            git reset --hard origin/main
            cd pdai-calculator
            IMAGE_TAG=${{ github.sha }} docker compose up -d --force-recreate app
            docker compose up -d certbot
            rm -f /tmp/pdai-app.tar.gz
