name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdai-calculator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pdai-calculator/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy:
    needs: check
    # Manual only until the new server is provisioned (SSH key + deploy user +
    # hardening). Keeps `check` as the meaningful push signal instead of a
    # permanently-red SSH timeout. Re-enable push-deploy once the server is ready.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ~/app
            git fetch origin main
            git reset --hard origin/main
            cd pdai-calculator
            docker compose build --no-cache
            docker compose up -d --force-recreate
